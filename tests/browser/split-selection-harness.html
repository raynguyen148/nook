<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nook Split selection checks</title>
    <link rel="stylesheet" href="../../css/app.css" />
    <style>
      body { display: block; overflow: auto; padding: 1rem; }
      #status, #results { margin: 1rem; }
      #results li { margin: .5rem 0; }
      [data-status="fail"] { color: #dc2626; }
      [data-status="pass"] { color: #15803d; }
      #fixture { position: relative; display: block; width: 1100px; max-width: 100%; }
      #fixture .note-content-field { height: 280px; }
      #fixture .note-content-editor { height: 100%; }
      #fixture textarea, #fixture .note-content-preview { height: 100%; min-height: 0; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>Split selection regression checks</h1>
    <p>This fixture uses the production renderer and selection modules with synthetic text. No database is opened.</p>
    <p id="status" data-status="running">Running…</p>
    <ol id="results"></ol>
    <div id="fixture" class="note-dialog">
      <div class="note-content-field is-split">
        <div class="note-content-editor">
          <div class="note-editor-pane note-editor-pane--source"><span class="note-editor-pane__label">Markdown</span><textarea id="note-content"></textarea></div>
          <div class="note-editor-pane note-editor-pane--preview"><span class="note-editor-pane__label">Preview</span><div id="note-content-preview" class="note-content-preview quick-view-content" tabindex="0"></div></div>
        </div>
      </div>
      <div class="note-content-field is-split">
        <div class="note-content-editor">
          <div class="note-editor-pane note-editor-pane--source"><span class="note-editor-pane__label">Side Markdown</span><textarea id="secondary-note-content-editor"></textarea></div>
          <div class="note-editor-pane note-editor-pane--preview"><span class="note-editor-pane__label">Side preview</span><div id="secondary-split-preview" class="note-content-preview quick-view-content" tabindex="0"></div></div>
        </div>
      </div>
    </div>
    <script src="../../js/markdown.js"></script>
    <script src="./split-selection-harness.js"></script>
  </body>
</html>
