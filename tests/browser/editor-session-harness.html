<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nook EditorSession browser harness</title>
    <style>
      :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
      body { margin: 2rem auto; max-width: 64rem; padding: 0 1rem; }
      code { overflow-wrap: anywhere; }
      #status[data-status="pass"], .pass { color: #176b3a; }
      #status[data-status="fail"], .fail { color: #a31d1d; }
      #results { display: grid; gap: .6rem; padding: 0; list-style: none; }
      .case { border: 1px solid #888; border-radius: .4rem; padding: .7rem 1rem; }
      .case[data-status="pass"] { border-color: #4d9b6b; }
      .case[data-status="fail"] { border-color: #c55757; }
      .case pre { margin: .5rem 0 0; white-space: pre-wrap; }
      button { font: inherit; padding: .45rem .8rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Nook EditorSession browser harness</h1>
      <p id="status" data-status="running">Preparing isolated-origin IndexedDB checks…</p>
      <p>
        Origin: <code id="origin"></code><br />
        Database: <code>personal-notes</code> (reset only on this origin before the run)
      </p>
      <button id="rerun" type="button">Rerun harness</button>
      <ol id="results" aria-live="polite"></ol>
    </main>
    <script src="./editor-session-harness.js"></script>
  </body>
</html>
