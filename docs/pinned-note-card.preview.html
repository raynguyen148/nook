<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nook pinned note card — states preview</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/note-components.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="../css/interactions.css" />
    <link rel="stylesheet" href="../css/library.css" />
    <link rel="stylesheet" href="../css/accessibility.css" />
    <link rel="stylesheet" href="../css/themes/classic.css" />
    <link rel="stylesheet" href="../css/themes/warm.css" />
    <link rel="stylesheet" href="../css/themes/dark.css" />
    <style>
      /* Hallmark · component preview: pinned note card · genre: modern-minimal · theme: Nook themes
       * states: default · hover · focus · active · disabled · loading · error · success
       * contrast: status meaning is paired with text; production colours use theme tokens
       * pre-emit critique: P5 H5 E5 S5 R5 V4
       */

      html,
      body {
        min-width: 0;
        overflow-x: clip;
      }

      .preview-page {
        width: min(100%, 64rem);
        margin-inline: auto;
        padding: 2rem 1rem 3rem;
      }

      .preview-header {
        display: grid;
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .preview-header h1,
      .preview-header p {
        min-width: 0;
        margin: 0;
      }

      .preview-header h1 {
        font-family: var(--font-display);
        font-size: 1.5rem;
        font-style: normal;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }

      .preview-header p {
        max-width: 62ch;
        line-height: 1.6;
      }

      .preview-themes {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .preview-themes .button {
        white-space: nowrap;
      }

      .preview-states {
        display: grid;
        gap: 1.25rem;
      }

      .preview-row {
        display: grid;
        min-width: 0;
        gap: 0.5rem;
      }

      .preview-label {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.75rem;
        color: var(--primary-accent-text);
        font-family: var(--font-sans);
        font-size: 0.78rem;
        font-weight: 700;
      }

      .preview-status {
        color: inherit;
        font-weight: 500;
      }

      .preview-card {
        min-width: 0;
      }

      .preview-card .note-card__title {
        text-align: start;
      }

      .preview-card .note-card__actions {
        opacity: 1;
      }

      .preview-card .note-card__pin-toggle.is-focus {
        outline: 2px solid var(--focus-color);
        outline-offset: 2px;
      }

      html .preview-card[data-state="error"] {
        border-color: var(--toast-error-border);
      }

      html .preview-card[data-state="success"] {
        border-color: var(--pinned-card-border);
      }

      @media (min-width: 48rem) {
        .preview-states {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main class="preview-page">
      <header class="preview-header">
        <h1>Pinned note card — eight states</h1>
        <p>One quiet treatment across Nook: a low-contrast border, a barely tinted surface, and a clearer pin marker. Only the palette changes between themes.</p>
        <div class="preview-themes" role="group" aria-label="Preview theme">
          <button class="button button-secondary" type="button" data-preview-theme="light" aria-pressed="true">Light</button>
          <button class="button button-secondary" type="button" data-preview-theme="warm" aria-pressed="false">Warm</button>
          <button class="button button-secondary" type="button" data-preview-theme="dark" aria-pressed="false">Dark</button>
        </div>
      </header>

      <section id="preview-states" class="preview-states" aria-label="Pinned note card states"></section>
    </main>

    <template id="note-card-template">
      <article class="note-card note-card--pinned preview-card">
        <button class="note-card__pin-toggle" type="button" aria-label="Unpin Pinned reference note" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8.2 4.25h7.6l-1.15 5.1 3.1 3.1v1.1H6.25v-1.1l3.1-3.1-1.15-5.1Z" />
            <path d="M12 13.55v6.2" />
          </svg>
        </button>
        <div class="note-card__content">
          <div class="note-card__meta">
            <span class="type-badge type-badge--slate">General</span>
            <time class="note-card__date" datetime="2026-09-06">Created Sep 6, 2026</time>
          </div>
          <button class="note-card__title" type="button" aria-label="Preview note: Pinned reference note">Pinned reference note</button>
          <p class="note-card__preview">A familiar note kept within quick reach, without competing with the rest of the library.</p>
        </div>
        <div class="note-card__footer">
          <div class="note-card__tags"><span class="untagged">No tags</span></div>
          <div class="note-card__actions" aria-label="Card actions">
            <button class="note-card__action" type="button" aria-label="Preview Pinned reference note">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2.4 12s3.4-5.2 9.6-5.2 9.6 5.2 9.6 5.2-3.4 5.2-9.6 5.2S2.4 12 2.4 12Z" />
                <circle cx="12" cy="12" r="2.35" />
              </svg>
            </button>
            <button class="note-card__action" type="button" aria-label="Edit Pinned reference note">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m14.6 5.4 4 4" />
                <path d="M4.5 19.5 6 14l9.6-9.6a1.65 1.65 0 0 1 2.35 0l1.65 1.65a1.65 1.65 0 0 1 0 2.35L10 18l-5.5 1.5Z" />
              </svg>
            </button>
          </div>
        </div>
      </article>
    </template>

    <script>
      (() => {
        "use strict";

        const states = [
          { label: "Default" },
          { label: "Hover", cardClass: "is-hover" },
          { label: "Focus", pinClass: "is-focus" },
          { label: "Active", pinClass: "is-active" },
          { label: "Disabled", disabled: true },
          { label: "Loading", cardState: "loading", status: "Updating pin…" },
          { label: "Error", cardState: "error", status: "Couldn’t update pin." },
          { label: "Success", cardState: "success", status: "Pinned." },
        ];
        const stateList = document.querySelector("#preview-states");
        const cardTemplate = document.querySelector("#note-card-template");

        states.forEach((state) => {
          const row = document.createElement("div");
          row.className = "preview-row";
          const label = document.createElement("div");
          label.className = "preview-label";
          const name = document.createElement("span");
          name.textContent = state.label;
          label.append(name);
          if (state.status) {
            const status = document.createElement("span");
            status.className = "preview-status";
            status.textContent = state.status;
            label.append(status);
          }

          const card = cardTemplate.content.firstElementChild.cloneNode(true);
          const pin = card.querySelector(".note-card__pin-toggle");
          if (state.cardClass) card.classList.add(state.cardClass);
          if (state.pinClass) pin.classList.add(state.pinClass);
          if (state.cardState) card.dataset.state = state.cardState;
          if (state.disabled) {
            card.setAttribute("aria-disabled", "true");
            pin.disabled = true;
          }
          if (state.cardState === "loading") pin.setAttribute("aria-busy", "true");

          row.append(label, card);
          stateList.append(row);
        });

        const themeButtons = [...document.querySelectorAll("[data-preview-theme]")];
        themeButtons.forEach((button) => {
          button.addEventListener("click", () => {
            document.documentElement.dataset.theme = button.dataset.previewTheme;
            themeButtons.forEach((candidate) => {
              candidate.setAttribute("aria-pressed", String(candidate === button));
            });
          });
        });
      })();
    </script>
  </body>
</html>
