<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="f-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="40%" stop-color="#064e3b"/>
      <stop offset="75%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#011814"/>
    </linearGradient>
    <linearGradient id="f-ribbon-emerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#10b981" stop-opacity="0.80"/>
      <stop offset="70%" stop-color="#34d399" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="f-ribbon-teal" x1="0%" y1="0%" x2="100%" y2="100%">
