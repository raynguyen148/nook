      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.70"/>
      <stop offset="80%" stop-color="#22d3ee" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0.25"/>
