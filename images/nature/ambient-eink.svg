<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="e-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#f1f5f9"/>
      <stop offset="75%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="e-ribbon-celadon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.82"/>
      <stop offset="35%" stop-color="#14b8a6" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#2dd4bf" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#99f6e4" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="e-ribbon-pebble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.80"/>
      <stop offset="45%" stop-color="#475569" stop-opacity="0.70"/>
      <stop offset="75%" stop-color="#64748b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.30"/>
