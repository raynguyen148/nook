<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="r-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241e15"/>
      <stop offset="40%" stop-color="#3a2f20"/>
      <stop offset="75%" stop-color="#4a3c28"/>
      <stop offset="100%" stop-color="#1c160f"/>
    </linearGradient>
    <linearGradient id="r-ribbon-moss" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4d7c0f" stop-opacity="0.88"/>
      <stop offset="35%" stop-color="#65a30d" stop-opacity="0.82"/>
      <stop offset="70%" stop-color="#84cc16" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#bef264" stop-opacity="0.60"/>
    </linearGradient>
    <linearGradient id="r-ribbon-copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#c2410c" stop-opacity="0.75"/>
      <stop offset="75%" stop-color="#ea580c" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="r-ribbon-gold" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ca8a04" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.50"/>
    </linearGradient>
    <radialGradient id="r-glow-archival" cx="82%" cy="16%" r="55%">
      <stop offset="0%" stop-color="#fefce8" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#fef9c3" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#fef08a" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#65a30d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="r-glow-sepia" cx="20%" cy="80%" r="52%">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0.72"/>
      <stop offset="50%" stop-color="#78350f" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#1c160f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Archival Canvas Base -->
  <rect width="1600" height="900" fill="url(#r-base)"/>
  <!-- Gold Vellum Wave -->
  <path d="M-100 930 C230 790 380 450 800 420 C1220 390 1350 620 1700 580 L1700 1000 L-100 1000 Z" fill="url(#r-ribbon-gold)"/>
  <!-- Burnt Copper Wave -->
  <path d="M-50 660 C300 590 520 250 960 200 C1340 150 1460 360 1680 300 L1680 930 C1330 870 1080 750 740 770 C380 790 140 890 -50 930 Z" fill="url(#r-ribbon-copper)"/>
  <!-- Archival Olive Moss Crest -->
  <path d="M180 -40 C530 160 830 100 1180 30 C1430 -30 1530 70 1660 50 L1660 -100 L180 -100 Z" fill="url(#r-ribbon-moss)"/>
  <!-- Archival Glows -->
  <rect width="1600" height="900" fill="url(#r-glow-sepia)"/>
  <rect width="1600" height="900" fill="url(#r-glow-archival)"/>
</svg>